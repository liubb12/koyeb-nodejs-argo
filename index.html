<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathfinder PRO 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,sans-serif;background:#030712;color:#e2e8f0;background-image:radial-gradient(at 0 0,rgba(16,185,129,.08) 0px,transparent 50%),radial-gradient(at 100% 0,rgba(59,130,246,.08) 0px,transparent 50%),radial-gradient(at 100% 100%,rgba(139,92,246,.08) 0px,transparent 50%);min-height:100vh}
    .glass{background:rgba(15,23,42,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 30px rgba(0,0,0,.2)}
    .card-hover{transition:all .3s ease}.card-hover:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4);border-color:rgba(255,255,255,.15)}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.online{background:#10b981;box-shadow:0 0 8px #10b981;animation:pulse 2s infinite}.offline{background:#ef4444;box-shadow:0 0 8px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .input-dark{background:rgba(2,6,23,.8);border:1px solid rgba(255,255,255,.1);transition:all .2s}.input-dark:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.3);outline:none}
    .btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 15px rgba(59,130,246,.3);transition:all .2s}.btn-primary:hover{box-shadow:0 6px 20px rgba(59,130,246,.5);transform:translateY(-1px)}
    .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 15px rgba(239,68,68,.3);transition:all .2s}.btn-danger:hover{box-shadow:0 6px 20px rgba(239,68,68,.5);transform:translateY(-1px)}
    .log-box::-webkit-scrollbar{width:4px}.log-box::-webkit-scrollbar-track{background:rgba(0,0,0,.2);border-radius:10px}.log-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
    .toggle-btn{transition:all .2s ease;border:1px solid transparent}.toggle-btn:active{transform:scale(.95)}.toggle-btn.off{background:rgba(30,41,59,.8);border-color:rgba(255,255,255,.05);color:#94a3b8}.toggle-btn.off:hover{background:rgba(51,65,85,.8)}
  </style>
</head>
<body class="p-4 md:p-8 pb-24">
  <div class="max-w-7xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
      <div class="flex items-center gap-6">
        <div>
          <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 via-emerald-400 to-purple-400 bg-clip-text text-transparent uppercase tracking-tighter">Pathfinder PRO</h1>
          <p class="text-slate-500 text-sm mt-1 font-medium tracking-wide">Minecraft 挂人挂机系统 v2025</p>
        </div>
      </div>
      <div class="glass p-2 rounded-2xl flex gap-2 w-full md:w-auto border border-white/10">
        <input id="h" placeholder="IP:PORT" class="input-dark rounded-xl px-4 py-2.5 text-sm text-white flex-1 md:w-48">
        <input id="u" placeholder="用户名" class="input-dark rounded-xl px-4 py-2.5 text-sm text-white md:w-36">
        <button onclick="addBot()" class="btn-primary text-white px-6 py-2.5 rounded-xl text-sm font-bold active:scale-95">添加</button>
      </div>
    </header>
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    <div id="mem-bar" class="fixed bottom-6 right-6 p-4 glass rounded-2xl flex items-center gap-4 z-40 shadow-2xl border border-white/10">
      <div class="flex flex-col items-center justify-center"><span id="mem-percent" class="text-xl font-black text-white tracking-tight">0.0</span><span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">RAM</span></div>
      <div class="w-28 h-2 bg-slate-800 rounded-full overflow-hidden shadow-inner"><div id="mem-progress" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 transition-all duration-700 rounded-full" style="width:0%"></div></div>
    </div>
  </div>
  <script>
    async function updateSystemStatus(){try{const r=await fetch('/api/system/status');const d=await r.json();document.getElementById('mem-percent').innerText=d.percent;document.getElementById('mem-progress').style.width=d.percent+'%';}catch(e){}}
    async function addBot(){await fetch('/api/bots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:document.getElementById('h').value,username:document.getElementById('u').value})});updateUI(true)}
    async function restartNow(id){await fetch('/api/bots/'+id+'/restart-now',{method:'POST'});updateUI(true)}
    async function setTimer(id,value,unit){await fetch('/api/bots/'+id+'/set-timer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value,unit})});updateUI(true)}
    async function savePto(id){const data={url:document.getElementById('url-'+id).value,id:document.getElementById('sid-'+id).value,key:document.getElementById('key-'+id).value,defaultDir:document.getElementById('ddir-'+id).value};await fetch('/api/bots/'+id+'/pto-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});updateUI(true)}
    async function toggleGuard(id){await fetch('/api/bots/'+id+'/toggle-guard',{method:'POST'});updateUI(true)}
    async function toggle(id,type){await fetch('/api/bots/'+id+'/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type})});updateUI(true)}
    async function removeBot(id){if(confirm('确定删除？')){await fetch('/api/bots/'+id,{method:'DELETE'});updateUI(true)}}
    async function uploadFile(id,input){if(!input.files[0])return;const formData=new FormData();formData.append('file',input.files[0]);const res=await fetch('/api/bots/'+id+'/upload',{method:'POST',body:formData});alert(res.ok?'上传成功':'上传失败');input.value='';}
    async function updateUI(force=false){const r=await fetch('/api/bots');const d=await r.json();document.getElementById('list').innerHTML=d.bots.map(b=>`<div class="glass rounded-3xl overflow-hidden border-t-4 ${b.status==='在线'?'border-emerald-500':'border-red-500'} card-hover flex flex-col"><div class="p-6 flex-1 flex flex-col gap-4"><div class="flex justify-between items-center"><div><div class="flex items-center gap-2.5"><h3 class="text-xl font-extrabold tracking-tight">${b.username}</h3><span class="px-2.5 py-1 rounded-full text-[10px] font-bold flex items-center gap-1.5 ${b.status==='在线'?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}"><span class="status-dot ${b.status==='在线'?'online':'offline'}"></span>${b.status}</span></div><p class="text-xs text-slate-500 mt-1 font-medium">${b.host}:${b.port}</p></div><button onclick="removeBot('${b.id}')" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-red-600 hover:text-white text-slate-500 transition-colors flex items-center justify-center text-sm font-bold shadow-inner">×</button></div><div class="log-box bg-black/60 rounded-2xl p-4 h-40 overflow-y-auto font-mono text-[11px] border border-slate-800/50 shadow-inner">${(b.logs||[]).map(l=>`<div class="mb-1.5 ${l.color||''} flex"><span class="opacity-30 mr-2 shrink-0 select-none">[${l.time}]</span><span>${l.msg}</span></div>`).join('')}</div><div class="grid grid-cols-3 gap-2"><button onclick="toggle('${b.id}','ai')" class="toggle-btn ${b.settings.ai?'bg-blue-600/90 shadow-lg shadow-blue-500/30 text-white':'off'} py-2.5 rounded-xl text-xs font-bold">👁️ AI视角</button><button onclick="toggle('${b.id}','walk')" class="toggle-btn ${b.settings.walk?'bg-emerald-600/90 shadow-lg shadow-emerald-500/30 text-white':'off'} py-2.5 rounded-xl text-xs font-bold">👣 巡逻</button><button onclick="toggle('${b.id}','chat')" class="toggle-btn ${b.settings.chat?'bg-orange-600/90 shadow-lg shadow-orange-500/30 text-white':'off'} py-2.5 rounded-xl text-xs font-bold">💬 喊话</button></div><div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/50"><div class="flex justify-between items-center mb-3"><h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">重启序列</h4><span class="text-[10px] text-slate-500">下次: <span class="text-cyan-400 font-semibold">${b.nextRestart}</span></span></div><div class="grid grid-cols-2 gap-2 mb-3"><div><input id="min-${b.id}" type="number" placeholder="分钟" class="input-dark w-full rounded-xl px-3 py-2 text-xs text-white"><button onclick="setTimer('${b.id}',document.getElementById('min-${b.id}').value,'min')" class="mt-1.5 w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-[10px] font-bold transition-colors">设定分钟</button></div><div><input id="hour-${b.id}" type="number" placeholder="小时" class="input-dark w-full rounded-xl px-3 py-2 text-xs text-white"><button onclick="setTimer('${b.id}',document.getElementById('hour-${b.id}').value,'hour')" class="mt-1.5 w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-[10px] font-bold transition-colors">设定小时</button></div></div><button onclick="restartNow('${b.id}')" class="btn-danger w-full py-2.5 rounded-xl text-xs font-bold uppercase active:scale-95 transition-all">⚡ 立即重启</button></div><details class="group"><summary class="flex justify-between items-center cursor-pointer list-none bg-slate-900/60 p-3 rounded-2xl border border-slate-800/50 hover:border-slate-700 transition-colors"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">翼龙同步</span><span class="transition group-open:rotate-180 text-slate-500 text-xs">▼</span></summary><div class="mt-2 space-y-2 p-3 bg-slate-900/60 rounded-2xl border border-slate-800/50"><input id="url-${b.id}" placeholder="URL" value="${b.settings.pterodactyl?.url||''}" class="input-dark w-full rounded-xl px-3 py-2 text-xs text-white"><div class="grid grid-cols-2 gap-2"><input id="sid-${b.id}" placeholder="ID" value="${b.settings.pterodactyl?.id||''}" class="input-dark w-full rounded-xl px-3 py-2 text-xs text-white"><input id="ddir-${b.id}" placeholder="目录" value="${b.settings.pterodactyl?.defaultDir||'/'}" class="input-dark w-full rounded-xl px-3 py-2 text-xs text-emerald-400"></div><input id="key-${b.id}" type="password" placeholder="API Key" value="${b.settings.pterodactyl?.key||''}" class="input-dark w-full rounded-xl px-3 py-2 text-xs text-white"><div class="grid grid-cols-2 gap-2 pt-1"><button onclick="savePto('${b.id}')" class="bg-slate-800 hover:bg-slate-700 text-[10px] py-2.5 rounded-xl font-bold transition-colors">保存配置</button><button onclick="document.getElementById('f-${b.id}').click()" class="btn-primary text-[10px] py-2.5 rounded-xl font-bold">上传文件</button><input type="file" id="f-${b.id}" class="hidden" onchange="uploadFile('${b.id}',this)"></div><button onclick="toggleGuard('${b.id}')" class="toggle-btn ${b.settings.pterodactyl?.guard?'bg-indigo-600/90 shadow-lg shadow-indigo-500/30 text-white':'off'} w-full py-2.5 rounded-xl text-[10px] font-bold mt-2">${b.settings.pterodactyl?.guard?'已开启守护':'开启守护'}</button></div></details></div></div>`).join('');}
    setInterval(()=>{updateUI();updateSystemStatus();},3000);updateUI(true);updateSystemStatus();
  </script>
</body>
</html>
